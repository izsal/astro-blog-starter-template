<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#070c1a" />
      <stop offset="100%" stop-color="#03060d" />
    </linearGradient>

    <!-- Outer Glow Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Core 'q' Lettermark Gradient -->
    <linearGradient id="qLetterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f0f9ff" />
      <stop offset="85%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Terminal Slash Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Pulsing Emerald Radial Glow -->
    <radialGradient id="emeraldRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Glow Filter for High DPI Displays -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dotGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />

  <!-- Ambient Light Reflection -->
  <circle cx="200" cy="220" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glowFilter)" />
  <circle cx="390" cy="115" r="70" fill="#10b981" opacity="0.22" filter="url(#glowFilter)" />

  <!-- The Iconic Header Status Dot (Neon Emerald Pulse) -->
  <circle cx="394" cy="118" r="44" fill="url(#emeraldRadial)" opacity="0.6" filter="url(#dotGlow)" />
  <circle cx="394" cy="118" r="22" fill="#10b981" />
  <circle cx="394" cy="118" r="11" fill="#ffffff" />

  <!-- Stylized Bold 'q' Brandmark -->
  <!-- Designed with thick geometry for high visibility at 16x16, 32x32, and 512x512 -->
  <g filter="url(#glowFilter)">
    <!-- 'q' Body: Bowl + Descender Stem with bottom hook -->
    <path
      d="
        M 215 140
        C 155 140 105 190 105 250
        C 105 310 155 360 215 360
        C 255 360 290 338 308 304
        L 308 395
        C 308 425 330 440 365 428
        L 365 380
        C 350 385 342 378 342 365
        L 342 148
        L 308 148
        L 308 196
        C 290 162 255 140 215 140
        Z
        M 220 188
        C 254 188 282 216 282 250
        C 282 284 254 312 220 312
        C 186 312 158 284 158 250
        C 158 216 186 188 220 188
        Z
      "
      fill="url(#qLetterGrad)"
    />

    <!-- Terminal Slash '/' Accent (from Header: qblog /qwarts) -->
    <path
      d="M 380 185 L 420 185 L 358 355 L 318 355 Z"
      fill="url(#slashGrad)"
      opacity="0.95"
    />
  </g>
</svg>
