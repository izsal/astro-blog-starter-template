<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1322" />
      <stop offset="50%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7" />
    </linearGradient>

    <!-- 'q' Vibrant Brand Gradient -->
    <linearGradient id="qTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Emerald Pulse Gradient -->
    <radialGradient id="emeraldRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Terminal Slash Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="emeraldPulse" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#bg)" stroke="url(#borderGlow)" stroke-width="12" />

  <!-- Ambient Glow Behind Elements -->
  <circle cx="210" cy="240" r="130" fill="#38bdf8" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="390" cy="120" r="70" fill="#10b981" opacity="0.2" filter="url(#softGlow)" />

  <!-- Iconic qblog Pulsing Green Status Dot (Top-Right) -->
  <circle cx="396" cy="116" r="38" fill="url(#emeraldRadial)" opacity="0.5" filter="url(#emeraldPulse)" />
  <circle cx="396" cy="116" r="18" fill="#10b981" />
  <circle cx="396" cy="116" r="9" fill="#ffffff" />

  <!-- Core Stylized 'q' Lettermark with Smooth Modern Curves -->
  <!-- Bowl: Circle at (205, 235), radius ~76 outer, ~42 inner -->
  <g filter="url(#softGlow)">
    <!-- q Bowl & Stem combined -->
    <path
      d="
        M 205 152
        C 152 152 110 194 110 246
        C 110 298 152 340 205 340
        C 246 340 278 314 288 278
        L 288 386
        C 288 412 308 424 336 414
        L 336 376
        C 324 380 318 374 318 362
        L 318 160
        L 288 160
        L 288 214
        C 278 178 246 152 205 152
        Z
        M 208 190
        C 238 190 262 214 262 246
        C 262 278 238 302 208 302
        C 178 302 154 278 154 246
        C 154 214 178 190 208 190
        Z
      "
      fill="url(#qTextGrad)"
    />

    <!-- Terminal Slash '/' Accent (from Header: qblog /qwarts) -->
    <path
      d="M 368 180 L 406 180 L 344 340 L 306 340 Z"
      fill="url(#slashGrad)"
      opacity="0.95"
    />
  </g>
</svg>
